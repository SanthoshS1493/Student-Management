<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Add Student</title>

<link rel="stylesheet" th:href="@{/css/style1.css}">
</head>

<body>
	<h1>Add Student</h1>
	
	<div class="outer">
	<div class="inner" >
	<form th:action="@{/save-student}" th:object="${student}" method="post" autocomplete="off">

		   <label for="id" id="id1">ID:</label> 
		   <input type="text" id="id" th:field="*{id}" required="required" placeholder="enter student id" /><br><br>
		    
		   <label id="name1">Name:</label>
		    <input type="text" id="name" th:field="*{name}" required="required" placeholder="enter student name"/><br><br> 
		   
		   <label id="standard1">Standard:</label> 
		   <input type="number" id="standard"  th:field="*{standard}" required="required"  placeholder="enter student standard"/><br><br>
		   
		   <label id="father1">Father's Name:</label> 
		   <input type="text" id="father" th:field="*{fatherName}" required="required" placeholder="enter father's name"/><br><br>
		    
		   <label id="gender1">Gender:</label> 
		   <select th:field="*{gender}" id="select">
			<option value="Male">Male</option>
			<option value="Female">Female</option>
		</select><br><br> 
		
		
		  <label id="address1">Address:</label>
		  <input type="text" id="address" th:field="*{address}" required="required" placeholder="enter student address"/><br><br>
		
		  <label id="phone1">Phone:</label>
		  <input type="text" id="phone" th:field="*{phone}" required="required" placeholder="enter phone number"/><br><br>

		<button type="submit">Save</button>
	</form>
	
	</div>
	</div>
	<br>
	<a href="/students">Back to List</a>
</body>

</html>
